[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enderscope"
version = "0.1.0"
description = "Control library for the Enderscope 3D-printer-based microscope"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Jérôme Mutterer"},
]
dependencies = [
    "pyserial",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "numpy",
    "matplotlib",
    "ipympl",
]

[project.urls]
Homepage = "https://github.com/mutterer/enderscopy"

[tool.setuptools.packages.find]
include = ["enderscope*"]
